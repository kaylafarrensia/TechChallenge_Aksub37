<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="../styles/register.css" />
  </head>
  <body>
    <div class="wrapper">
      <h2>Create your account</h2>
      <h5>Let's get started with your 30 days free trial</h5>

      <form class="regisForm" id="regisForm">
        <div class="inputForm">
          <label for="name">Name<span class="required">*</span></label>
          <input type="text" id="name" placeholder="johndoe" />
        </div>

        <div class="inputForm">
          <label for="email">Email<span class="required">*</span></label>
          <input type="email" id="email" placeholder="johndoe@gmail.com" />
        </div>

        <div class="inputForm">
          <label for="password">Password<span class="required">*</span></label>
          <input type="password" id="password" placeholder="*******" />
          <span class="pwrequirement"
            >Password needs to have a minimal of 8 characters, 1 uppercase and 1
            symbol</span
          >
        </div>

        <div class="inputForm">
          <label for="re-password"
            >Retype Password<span class="required">*</span></label
          >
          <input type="password" id="re-password" placeholder="*******" />
        </div>

        <label class="terms">
          <input type="checkbox" id="termsnconditions" />
          I agree to all term, privacy policy and fees
        </label>

        <button type="submit" class="submitRegis">Sign Up</button>

        <h5>
          Already have an account?
          <a class="loginPage" href="formLogin.html"> Log in</a>
        </h5>
      </form>
    </div>

    <script type="module" src="./src/register.js"></script>
  </body>
</html>
